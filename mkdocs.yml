site_name: studyDocs
site_description: 勉強会資料（Markdown）を GitHub Pages で公開するためのサイト
site_url: "https://santa928.github.io/studyDocs/"

repo_name: studyDocs
repo_url: "https://github.com/santa928/studyDocs"

theme:
  name: material
  language: ja
  features:
    - navigation.instant
    - navigation.sections
    - content.code.copy
  palette:
    - scheme: default

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - javascripts/mermaid-init.js

extra_css:
  - stylesheets/overlays-v2.css

plugins:
  - search:
      lang: ja

nav:
  - はじめに: index.md
  - ドキュメント:
      - 要件定義書: requirements.md
      - 仕様書: specification.md
      - 機能一覧: features.md
  - 勉強テーマ:
      - Git / GitHub: git-github/index.md
      - AWS: aws/index.md
      - Docker: docker/index.md
  - Docker（詳細）:
      - 入口: docker/index.md
      - Dockerとは: docker/what-is-docker.md
      - ImageとContainer: docker/image-vs-container.md
      - Dockerfileの基本: docker/dockerfile-basics.md
      - 単体コンテナの流れ: docker/single-container-workflow.md
      - Dockerfileサンプル集: docker/dockerfile-samples.md
      - Compose入門（後半戦）: docker/compose-intro.md
      - Composeサンプル集: docker/compose-samples.md
      - チートシート: docker/cheatsheet.md
  - AWS（詳細）:
      - 入口: aws/index.md
      - AWSとは: aws/what-is-aws.md
      - リージョンとAZ: aws/regions-and-az.md
      - IAM（権限）: aws/iam-basics.md
      - ネットワークの基本: aws/networking-basics.md
      - コンピュートの基本: aws/compute-basics.md
      - データの基本: aws/data-basics.md
      - 最小構成の例: aws/architecture-sample.md
      - チートシート: aws/cheatsheet.md
  - Git / GitHub（詳細）:
      - 概要: git-github/intro.md
      - Gitとは: git-github/what-is-git.md
      - GitHubとは: git-github/what-is-github.md
      - GitHubのヘッダー（メニュー）: git-github/github-header.md
      - 覚えておくコマンド: git-github/commands.md
      - リモート同期（fetch/pull）: git-github/remote-sync.md
      - コンフリクトとは: git-github/conflict.md
      - 履歴を整える（rebase/squash）: git-github/history-shaping.md
      - コミットを取り消す（revert/reset）: git-github/undo-commits.md
      - PRの流れとCI: git-github/pr-ci-flow.md
      - 用語集（会話のため）: git-github/glossary.md
      - レビュー用語集: git-github/review-glossary.md
